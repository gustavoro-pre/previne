<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PREVINE ELÉTRICA</title>
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f6;--card:#fff;--ink:#14213d;--muted:#5b6474;--line:#e2e5ea;
  --accent:#f2a900;--accent-ink:#3a2a00;
  --ok:#1f7a45;--ok-bg:#e6f4ec;--info:#2a5f9e;--info-bg:#e7eef8;
  --warn:#9a5b00;--warn-bg:#fdf1dc;--bad:#b3261e;--bad-bg:#fbe7e5;--mut:#5b6474;--mut-bg:#eceef1;
  --s1:#2a78d6;--s2:#eb6834;--s3:#6250d6;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;border-bottom:4px solid var(--accent)}
.hwrap{max-width:980px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo.img{background:#fff;width:auto;min-width:34px;max-width:96px;padding:3px 5px}.logo.img img{max-height:28px;max-width:86px;display:block}
.logoprev{display:flex;align-items:center;gap:14px;margin:6px 0 4px}.logoprev .lp{width:160px;height:64px;border:1px dashed var(--line,#ccd);border-radius:8px;display:grid;place-items:center;background:#fff}.logoprev img{max-width:150px;max-height:56px}
.htitle{font-weight:700;font-size:17px;letter-spacing:.2px;line-height:1.1}
.hsub{font-size:12px;opacity:.7}
.conn{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.12);white-space:nowrap}
.conn::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--accent)}
.conn.ok::before{background:#4cd38a}.conn.err::before{background:#ff6b5e}
main{max-width:980px;margin:0 auto;padding:16px 16px 110px}
h2{font-size:20px;margin:4px 0 14px}
h3{font-size:13px;margin:22px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.head h2{margin:0;margin-right:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card > .ct{font-weight:600;margin:0 0 2px}
.card > .cs{font-size:13px;color:var(--muted);margin:0 0 10px}
.lbl{display:block;font-weight:600;margin-bottom:8px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cfd4dc;border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,33,61,.12)}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--ink);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
@media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{border:1px solid transparent;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--mut-bg)}
.btn.primary{background:var(--ink);color:#fff}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:#fff;border-color:#cfd4dc}
.btn.danger{background:#fff;border-color:#e6b4b0;color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.big{width:100%;padding:15px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--info);font-weight:600;cursor:pointer;padding:4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(6,1fr)}.kpis.k5{grid-template-columns:repeat(5,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .t{font-size:12px;color:var(--muted)}
.kpi .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpi.ok .n{color:var(--ok)}.kpi.info .n{color:var(--info)}.kpi.warn .n{color:var(--warn)}.kpi.bad .n{color:var(--bad)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-info{background:var(--info-bg);color:var(--info)}
.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-mut{background:var(--mut-bg);color:var(--mut)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:#b9c0cb}
.item .main{flex:1;min-width:0}
.item .t1{font-weight:600}
.t2{font-size:13px;color:var(--muted)}
.item .side{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.code{font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--mut-bg);padding:1px 6px;border-radius:6px}
.item.late{border-left:4px solid var(--bad)}
.results{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.res{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px dashed #cfd4dc;border-radius:10px;background:#fafbfc;cursor:pointer;width:100%;text-align:left}
.res:hover{border-color:var(--ink)}
.res:disabled{cursor:not-allowed;opacity:.6}
.sel{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--info-bg);margin-top:6px}
.sel .main{flex:1;min-width:0}
.x{background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.chip{border:1px solid #cfd4dc;background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:flex;background:var(--mut-bg);border-radius:10px;padding:3px;gap:3px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.termo{font-size:13px;color:var(--muted);background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:10px;margin:0 0 10px}
.padwrap{position:relative;border:2px dashed #b9c0cb;border-radius:10px;background:#fff}
.padwrap canvas{display:block;width:100%;height:170px;touch-action:none;border-radius:10px}
.padwrap .padhint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#a3abb7;pointer-events:none;font-size:14px}
.padwrap.signed .padhint{display:none}
.padwrap::after{content:"";position:absolute;left:16px;right:16px;bottom:34px;border-bottom:1px solid #d5dae1;pointer-events:none}
.padwrap .link{position:absolute;right:6px;top:4px;font-size:13px}
.sigimg{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
.empty{text-align:center;color:var(--muted);padding:22px 12px;border:1px dashed #cfd4dc;border-radius:var(--r);background:#fafbfc}
.onb{background:linear-gradient(135deg,#14213d,#24365f);color:#fff;border:0}
.onb p{opacity:.85;margin:6px 0 12px}
.onb .btn{margin:4px 6px 0 0}
.demo{background:var(--warn-bg);border:1px solid #f1d39a;color:#6b4300;border-radius:var(--r);padding:10px 12px;margin-bottom:12px;font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{display:flex;max-width:980px;width:100%}
.tabs button{flex:1;min-width:0;background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--ink);border-top-color:var(--accent);font-weight:600}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,16,30,.5);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 24px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sheet .top h2{margin:0;flex:1;font-size:18px}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.actions .btn{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.ritem{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ritem:last-child{border-bottom:0}
.ritem .main{flex:1;min-width:0}
.ritem select{width:auto;padding:8px}
.erow{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;background:#fafbfc}
.erow .ehead{display:flex;gap:8px;align-items:flex-start}
.erow .ehead .main{flex:1}
.erow .ef{display:grid;grid-template-columns:70px 90px 1fr;gap:8px;margin-top:8px}
.erow .ef input,.erow .ef select{padding:8px 10px}
.kitrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.kitrow:last-child{border-bottom:0}
.kitrow .main{flex:1;min-width:0}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:6px 6px;white-space:nowrap}
.tb td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top}
.tb td.n,.tb th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb tr:last-child td{border-bottom:0}
.tbwrap{overflow-x:auto;margin-top:10px}
.chartbox{position:relative;height:260px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select{width:auto;padding:7px 10px;font-size:14px}
.rgrid{display:grid;grid-template-columns:1fr;gap:0 12px}
@media(min-width:860px){.rgrid{grid-template-columns:1fr 1fr}}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:60;max-width:92vw;padding:11px 16px;border-radius:10px;background:var(--ink);color:#fff;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.bad{background:var(--bad)}#toast.ok{background:var(--ok)}
.note{font-size:13px;color:var(--muted)}
.ro-banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.hidden{display:none!important}
#gate{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#14213d,#24365f);display:flex;align-items:center;justify-content:center;padding:20px}
#gate[hidden]{display:none}
.gbox{background:#fff;border-radius:16px;padding:24px 20px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.gbox h1{font-size:21px;margin:8px 0 4px}.gsub{color:var(--muted);margin:0 0 12px;font-size:14px}
.glogo{width:46px;height:46px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.glogo:has(img){background:none;width:auto;height:auto;justify-content:start}.glogo img{display:block;max-height:64px;max-width:200px;width:auto;height:auto;object-fit:contain}
.gmsg{font-size:14px;color:var(--ok);min-height:20px;margin:10px 0 0}.gmsg.bad{color:var(--bad)}
#toportal{color:#fff;text-decoration:none;font-size:12px;font-weight:600;padding:4px 10px;background:rgba(255,255,255,.12);border-radius:99px;margin-right:6px;white-space:nowrap}
#usermenu{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
#usermenu span{opacity:.7;margin-left:4px}
.qframe{position:absolute;left:50%;top:50%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid var(--accent);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.srow{display:flex;gap:8px;align-items:stretch}.srow input{flex:1;min-width:0}
.qbtn{flex:none;width:48px;border:1px solid #cfd4dc;border-radius:10px;background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer}.qbtn:active{background:var(--mut-bg)}
.mx{border-collapse:collapse;font-size:13px;min-width:100%}.mx th{font-weight:600;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:#fff;min-width:150px;max-width:220px}.mx td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}.mx input{width:20px;height:20px}
.autst{margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tip{font-size:12px;color:var(--muted);margin:6px 0 0}
</style>
<style>
.hello{margin:18px 0 4px;font-size:22px;font-weight:700}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:14px 0 24px}
.mod{display:flex;flex-direction:column;gap:6px;background:var(--card,#fff);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:inherit;min-height:120px;transition:transform .1s,box-shadow .1s}
a.mod:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(20,33,61,.12)}
.mod .mi{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:#fff4d6}
.mod h3{margin:4px 0 0;font-size:17px;text-transform:none;letter-spacing:0;color:var(--ink,#14213d)}.mod p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}
.aviso{display:flex;align-items:center;gap:10px;background:#fff4d6;border:1px solid #f2a900;color:#5a3d00;border-radius:12px;padding:12px 14px;margin:10px 0 4px;text-decoration:none;font-weight:600}.aviso .n{background:#c62828;color:#fff;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:14px;padding:0 7px;flex:none}.aviso .go{margin-left:auto;font-size:13px;text-decoration:underline}
.pushbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card,#fff);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0 4px;font-size:14px}.pushbox .m{flex:1;min-width:200px}
.mod .bn{align-self:flex-start;background:#c62828;color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:3px 9px}
.mod.off{opacity:.6}.mod .pf{margin-top:auto;font-size:12px;color:var(--muted)}
.urow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}.urow .main{flex:1;min-width:180px}
</style>
</head>

<header><div class="hwrap">
  <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3a2a00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></div>

<div id="gate"></div>
<div id="toast"></div>

  indicadores: { todos: 'Vê todas as áreas', nenhum: 'Sem acesso' },
  alocacao: { adm: 'Lança, edita e marca apontamento', consulta: 'Consulta (só vê)', nenhum: 'Sem acesso' },
  admissao: { rh: 'RH: abre, confere e conclui', consulta: 'Consulta (só vê, sem salário)', nenhum: 'Sem acesso' },
  documentos: { editor: 'Anexa, revisa e aprova', consulta: 'Consulta e baixa (sem restritos)', nenhum: 'Sem acesso' }
};
const DESC_MOD = [['Treinamentos · Gestor', 'Tudo no módulo: tipos, turmas, admissão, externos, áreas, padrões, cursos e acesso do aluno'], ['Treinamentos · TST / RH', 'Turmas, admissão, externos, padrões, cursos, áreas e funcionários'], ['Treinamentos · Instrutor', 'Turmas, padrões (listas e assinaturas) e cursos'], ['Treinamentos · Consulta', 'Vê tudo, não altera'], ['Indicadores', 'Todas as áreas, ou só uma área escolhida'], ['Alocação em OM · Lança', 'Cadastra OMs e equipe fixa, programa preventivas, completa pendências de OM e marca o apontamento'], ['Alocação em OM · Consulta', 'Vê tudo e tira PDF, não altera'], ['Admissão · RH', 'Abre a admissão, envia o link, confere documentos, registra ASO e integração e cadastra o funcionário'], ['Admissão · Consulta', 'Acompanha as admissões, sem ver salário e sem alterar']];
let AREAS = [], PEND = 0;
/* mesmo cálculo do fb.js: perfil efetivo em cada módulo */
function papelMod(d, id) {
  if (!d) return 'nenhum'; if (d.papel === 'admin') return 'admin'; if (d.papel === 'funcionario') return 'nenhum';
  if (id === 'ferramentas') return d.papel || 'nenhum';
  const m = (d.modulos || {})[id]; if (m) return m;
  if (d.papel === 'gestao') return 'gestao';
  if (id === 'treinamentos') return ({ gerente: 'gestor', tst: 'tst', rh: 'rh' })[d.papel] || 'nenhum';
  if (id === 'indicadores') return d.papel === 'gerente' ? 'todos' : 'nenhum';
  if (id === 'alocacao') return d.papel === 'gerente' ? 'adm' : 'nenhum';
  if (id === 'admissao') return ['rh', 'gerente'].includes(d.papel) ? 'rh' : 'nenhum';
  if (id === 'documentos') return d.papel === 'gerente' ? 'editor' : ['tst', 'rh'].includes(d.papel) ? 'consulta' : 'nenhum';
  return 'nenhum';
}
const temModulo = (d, id) => papelMod(d, id) !== 'nenhum';
const nomeMod = (id, v) => v === 'admin' ? 'Administrador' : v === 'gestao' ? 'Gestão' : id === 'ferramentas' ? (PAPEIS[v] || [v])[0] : /^area:/.test(v) ? 'Só ' + ((AREAS.find(a => 'area:' + a.id === v) || {}).nome || 'uma área') : ((PAPEIS_MOD[id] || {})[v] || v);
function renderMods() {
  const F = window.__FB, d = F.perfil;
  $('#p-hello').textContent = 'Olá, ' + str(F.nome).split(' ')[0];
  const L = MODS.filter(m => temModulo(d, m.id));
  $('#p-mods').innerHTML = (L.length ? L.map(m => `<a class="mod" href="${m.href}"><div class="mi">${m.icone}</div><h3>${esc(m.nome)}</h3>${m.id === 'treinamentos' && PEND ? `<span class="bn">${PEND} aguardando seu de acordo</span>` : ''}<p>${esc(m.desc)}</p><div class="pf">Seu perfil: ${esc(nomeMod(m.id, papelMod(d, m.id)))}</div></a>`).join('') : '<div class="empty">Nenhum módulo liberado para você ainda. Fale com o administrador.</div>')
    + (temModulo(d, 'treinamentos') ? `<a class="mod" href="aluno/" target="_blank" rel="noopener"><div class="mi">👷</div><h3>Portal do aluno</h3><p>Onde o funcionário entra com a matrícula para fazer os cursos on-line e assinar os padrões. Envie este link para a equipe.</p><div class="pf">${esc(new URL('aluno/', location.href).href)}</div></a>` : '');
}
function renderPush() {
  const F = window.__FB || {}, el = $('#p-push'); if (!el || !F.pushStatus) return; const st = F.pushStatus();
  if (st === 'sem-suporte') { el.hidden = true; return; } el.hidden = false;
  el.innerHTML = st === 'ativo' ? '<span>🔔</span><div class="m">Notificações ativas neste aparelho. Você recebe aviso quando houver documento aguardando o seu de acordo.</div>'
    : st === 'instalar' ? '<span>🔔</span><div class="m">Para receber notificações no iPhone: toque em Compartilhar → <b>Adicionar à Tela de Início</b>, abra o portal pelo ícone e volte aqui.</div>'
    : st === 'bloqueado' ? '<span>🔕</span><div class="m">As notificações estão bloqueadas para este site. Libere nas configurações do navegador (cadeado ao lado do endereço → Notificações → Permitir) e recarregue.</div>'
    : '<span>🔔</span><div class="m">Receba aviso no celular quando houver documento aguardando o seu de acordo.</div><button class="btn primary sm" id="p-pushgo" type="button">Ativar notificações</button>';
  const b = $('#p-pushgo'); if (b) b.onclick = async () => { b.disabled = true; b.textContent = 'Ativando…'; try { await F.ativarPush(); toast('Notificações ativadas neste aparelho.', 'ok'); } catch (e) { toast(({ bloqueado: 'Permissão negada no navegador.', 'sem-suporte': 'Este navegador não aceita notificações.' })[e.message] || 'Não foi possível ativar: ' + (e.message || e), 'bad'); } renderPush(); };
}
function renderUsers() {
  const F = window.__FB, d = F.perfil; const souAdm = d.papel === 'admin', souGestao = d.papel === 'gestao';
  $('#p-users').hidden = !(souAdm || souGestao); if ($('#p-users').hidden) return;
  const ae = document.activeElement; if (ae && ['pu-n', 'pu-e', 'pu-p', 'pu-t', 'pu-i', 'pu-a', 'pu-d', 'pu-o'].includes(ae.id)) return;
  const U0 = F.users(); const U = {}; Object.keys(U0).forEach(k => { if (U0[k].papel !== 'funcionario') U[k] = U0[k]; });
  const me = F.uid; const ALTOS = ['admin', 'gerente'];
  const protegido = u => souGestao && ALTOS.includes(u.papel);
  const opt = (sel, travado) => Object.entries(PAPEIS).filter(([k]) => travado || !souGestao || !ALTOS.includes(k)).map(([k, v]) => `<option value="${k}" ${sel === k ? 'selected' : ''}>${v[0]}</option>`).join('');
  const optM = (id, sel) => { const o = Object.assign({}, PAPEIS_MOD[id]); if (id === 'indicadores') AREAS.forEach(a => o['area:' + a.id] = 'Só a área ' + a.nome); if (!o[sel] && sel !== 'admin' && sel !== 'gestao') o[sel] = nomeMod(id, sel);
    return (['admin', 'gestao'].includes(sel) ? `<option value="" selected>${sel === 'admin' ? 'Administrador (tudo)' : 'Gestão (tudo)'}</option>` : '') + Object.entries(o).map(([k, v]) => `<option value="${esc(k)}" ${sel === k ? 'selected' : ''}>${esc(v)}</option>`).join(''); };
  const ids = Object.keys(U).sort((a, b) => (U[a].ativo === false) - (U[b].ativo === false) || str(U[a].nome).localeCompare(str(U[b].nome), 'pt'));
  $('#p-ubody').innerHTML = `<div class="card"><p class="ct">Cadastrar usuário</p><p class="cs">A pessoa recebe um e-mail para criar a própria senha. Depois entra no portal com e-mail e senha. Funcionários que só fazem cursos usam o portal do aluno (o acesso é criado no módulo Treinamentos).</p>
    <div class="grid2"><div><label for="pu-n">Nome completo</label><input id="pu-n"></div><div><label for="pu-e">E-mail</label><input id="pu-e" type="email" autocomplete="off"></div></div>
    <div class="grid3"><div><label for="pu-p">Ferramentas & EPI</label><select id="pu-p">${opt('nenhum')}</select></div><div><label for="pu-t">Treinamentos</label><select id="pu-t">${optM('treinamentos', 'nenhum')}</select></div><div><label for="pu-i">Indicadores</label><select id="pu-i">${optM('indicadores', 'nenhum')}</select></div><div><label for="pu-a">Alocação em OM</label><select id="pu-a">${optM('alocacao', 'nenhum')}</select></div><div><label for="pu-d">Admissão</label><select id="pu-d">${optM('admissao', 'nenhum')}</select></div><div><label for="pu-o">Documentação</label><select id="pu-o">${optM('documentos', 'nenhum')}</select></div></div>
    <div class="actions"><button class="btn primary" id="pu-add">Cadastrar e enviar convite</button></div></div>
    <div class="card"><p class="ct">Usuários (${ids.length})</p>${ids.map(id => { const u = U[id]; const eu = id === me; const trav = eu || protegido(u); const ad = u.papel === 'admin';
      const sm = mid => `<label class="note" style="margin:0">${({ treinamentos: 'Treinamentos', indicadores: 'Indicadores', alocacao: 'Alocação em OM', admissao: 'Admissão', documentos: 'Documentação' })[mid]}</label><select data-pm="${esc(id)}|${mid}" style="width:auto;padding:7px" ${trav || ad ? 'disabled' : ''}>${optM(mid, papelMod(u, mid))}</select>`;
      return `<div class="urow"><div class="main"><b>${esc(u.nome)}</b>${eu ? ' <span class="badge b-info">você</span>' : ''}${u.ativo === false ? ' <span class="badge b-bad">Desativado</span>' : ''}<div class="t2 note">${esc(u.email)}</div></div>
      <label class="note" style="margin:0">Ferramentas & EPI</label><select data-pp="${esc(id)}" style="width:auto;padding:7px" ${trav ? 'disabled' : ''}>${opt(u.papel, trav)}</select>
      ${sm('treinamentos')}${sm('indicadores')}${sm('alocacao')}${sm('admissao')}${sm('documentos')}
      ${protegido(u) ? '' : `<button class="btn sm ghost" data-pinv="${esc(u.email)}">Reenviar convite</button>`}${trav ? '' : `<button class="btn sm ${u.ativo === false ? 'ghost' : 'danger'}" data-pat="${esc(id)}">${u.ativo === false ? 'Reativar' : 'Desativar'}</button>`}</div>`; }).join('')}</div>
    <div class="card"><p class="ct">O que cada perfil faz</p><div class="tbwrap"><table class="tb"><thead><tr><th>Perfil</th><th>Acesso</th></tr></thead><tbody>${Object.values(PAPEIS).map(p => `<tr><td><b>${p[0]}</b></td><td>${p[1]}</td></tr>`).join('')}${DESC_MOD.map(p => `<tr><td><b>${p[0]}</b></td><td>${p[1]}</td></tr>`).join('')}</tbody></table></div>
    <p class="note">Quem não tem perfil definido em Treinamentos herda: Gerente vira Gestor, TST e RH continuam TST e RH. Gestão e Administrador veem tudo.</p></div>`;
  $('#pu-add').onclick = async () => {
    const nome = $('#pu-n').value.trim(), email = $('#pu-e').value.trim().toLowerCase(), papel = $('#pu-p').value;
    const modulos = { treinamentos: $('#pu-t').value, indicadores: $('#pu-i').value, alocacao: $('#pu-a').value, admissao: $('#pu-d').value, documentos: $('#pu-o').value };
    if (nome.split(/\s+/).length < 2) return toast('Informe o nome completo.', 'bad');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('E-mail inválido.', 'bad');
    if (Object.values(U0).some(u => str(u.email).toLowerCase() === email)) return toast('Esse e-mail já está cadastrado.', 'bad');
    if (papel === 'nenhum' && Object.values(modulos).every(v => v === 'nenhum')) return toast('Dê acesso a pelo menos um módulo.', 'bad');
    const b = $('#pu-add'); b.disabled = true; b.textContent = 'Cadastrando…';
    try { await F.criarUsuario({ nome, email, papel, modulos }); toast(`Convite enviado para ${email}.`, 'ok'); $('#pu-n').value = ''; $('#pu-e').value = ''; }
    catch (e) { toast((e && e.message) || 'Não foi possível cadastrar.', 'bad'); }
    finally { b.disabled = false; b.textContent = 'Cadastrar e enviar convite'; }
  };
  $$('#p-ubody [data-pp]').forEach(sl => sl.onchange = async () => { try { await F.atualizarUsuario(sl.dataset.pp, { papel: sl.value }); toast('Perfil alterado.', 'ok'); } catch (e) { toast('Não foi possível alterar.', 'bad'); } });
  $$('#p-ubody [data-pm]').forEach(sl => sl.onchange = async () => { const [uid, mid] = sl.dataset.pm.split('|'); if (!sl.value) return; const m = Object.assign({}, U[uid].modulos || {}, { [mid]: sl.value });
    try { await F.atualizarUsuario(uid, { modulos: m }); toast('Acesso alterado.', 'ok'); } catch (e) { toast('Não foi possível alterar.', 'bad'); } });
  $$('#p-ubody [data-pinv]').forEach(b => b.onclick = async () => { try { await F.reenviarConvite(b.dataset.pinv); toast('Convite reenviado.', 'ok'); } catch (e) { toast('Não foi possível reenviar.', 'bad'); } });
  $$('#p-ubody [data-pat]').forEach(b => { let armed = false; b.onclick = async () => { const u = U[b.dataset.pat]; if (u.ativo !== false && !armed) { armed = true; b.textContent = 'Confirmar'; return; } try { await F.atualizarUsuario(b.dataset.pat, { ativo: u.ativo === false }); toast(u.ativo === false ? 'Reativado.' : 'Desativado.', 'ok'); } catch (e) { toast('Não foi possível alterar.', 'bad'); } }; });
}
(async () => {
  const db = await claude.use('db');
  db.doc('config/empresa').onSnapshot(s => { const e = s.exists ? s.data() : {}; if (e.nome) $('#p-emp').textContent = e.nome;
    if (/^data:image\/(png|jpeg);base64,/.test(str(e.logo))) { const l = $('header .logo'); l.classList.add('img'); l.innerHTML = `<img src="${e.logo}" alt="Logo">`; } }, () => {});
  db.collection('funcionarios').limit(1).get().then(() => { const c = $('#conn'); c.textContent = 'Online'; c.className = 'conn ok'; }, () => {});
  db.collection('areas').onSnapshot(q => { AREAS = q.docs.map(x => Object.assign({ id: x.id }, x.data())).sort((a, b) => str(a.nome).localeCompare(str(b.nome), 'pt')); renderUsers(); }, () => {});
  renderMods(); renderUsers(); renderPush();
  window.addEventListener('fb-users', renderUsers);
  /* aviso de de acordo pendente: certificados em que o usuário é instrutor, RT ou TST e ainda não deu o de acordo */
  const F = window.__FB || {};
  if (temModulo(F.perfil, 'treinamentos')) db.collection('treinamentos').onSnapshot(q => {
    const nr = v => str(v).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim().replace(/\s+/g, ' '), eu = nr(F.nome), k = eu.replace(/[^a-z0-9]+/g, '_');
    PEND = eu ? q.docs.map(x => x.data()).filter(r => [r.instrutor, r.rt, r.tst].some(n => nr(n) === eu) && !((r.aprov || {})[k])).length : 0;
    const av = $('#p-aviso'); av.hidden = !PEND; av.innerHTML = PEND ? `<span class="n">${PEND}</span><span>${PEND === 1 ? 'Certificado aguardando' : 'Certificados aguardando'} o seu de acordo</span><span class="go">Ver agora</span>` : '';
    renderMods();
  }, () => {});
})();
</script>
