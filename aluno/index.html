<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Treinamentos · Portal do aluno</title>
<meta name="theme-color" content="#14213d">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#14213d;--muted:#5b6474;--line:#e2e5ea;--accent:#f2a900;--accent-ink:#3a2a00;--ok:#1f7a45;--ok-bg:#e6f4ec;--info:#2a5f9e;--info-bg:#e7eef8;--warn:#9a5b00;--warn-bg:#fdf1dc;--bad:#b3261e;--bad-bg:#fbe7e5;--mut-bg:#eceef1;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;border-bottom:4px solid var(--accent)}
.hw{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo.img{background:#fff;width:auto;max-width:96px;padding:3px 5px}.logo.img img{max-height:28px;max-width:86px;display:block}
.ht{font-weight:700;font-size:17px;line-height:1.1}.hs{font-size:12px;opacity:.75}
#out{margin-left:auto;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:22px;margin:6px 0 4px}h2{font-size:19px;margin:4px 0 12px}
h3{font-size:13px;margin:22px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input{width:100%;padding:13px 12px;border:1px solid #cfd4dc;border-radius:10px;background:#fff;outline:none;font-size:17px}
input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,33,61,.12)}
.btn{display:block;width:100%;border:1px solid transparent;border-radius:12px;padding:14px;font-weight:600;font-size:16px;cursor:pointer;background:var(--mut-bg);text-align:center;text-decoration:none;margin-top:10px}
.btn.primary{background:var(--ink);color:#fff}.btn.accent{background:var(--accent);color:var(--accent-ink)}.btn.ghost{background:#fff;border-color:#cfd4dc}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--info);font-weight:600;cursor:pointer;padding:6px 0;font-size:15px}
.item{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%;margin-bottom:10px}
.item .main{flex:1;min-width:0}.t1{font-weight:600}.t2{font-size:14px;color:var(--muted)}
.item[disabled]{cursor:default;opacity:.6}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-info{background:var(--info-bg);color:var(--info)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-mut{background:var(--mut-bg);color:var(--muted)}
.bar{height:8px;background:var(--mut-bg);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:#fff4d6;flex:none}
.empty{text-align:center;color:var(--muted);padding:20px 12px;border:1px dashed #cfd4dc;border-radius:var(--r);background:#fafbfc}
.msg{font-size:15px;min-height:22px;margin:10px 0 0;color:var(--ok)}.msg.bad{color:var(--bad)}
.back{background:none;border:0;color:var(--info);font-weight:600;cursor:pointer;padding:4px 0 10px;font-size:15px}
.pdfv canvas{display:block;width:100%;height:auto;margin:0 0 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.pdfv img{display:block;width:100%;border-radius:6px}
.vid{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}.vid iframe,.vid>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.txt{white-space:pre-wrap}
.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 8px;margin-top:8px}
.q{margin-bottom:14px}.q p{font-weight:600;margin:0 0 8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:#fff;font-size:16px}
.opt input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--ink)}
.opt.sel{border-color:var(--ink);background:#f3f5fa}
.termo{font-size:15px;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 10px}
.padwrap{position:relative;border:2px dashed #b9c0cb;border-radius:10px;background:#fff}
.padwrap canvas{display:block;width:100%;height:180px;touch-action:none;border-radius:10px}
.padhint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#a3abb7;pointer-events:none}
.padwrap.signed .padhint{display:none}
.padwrap .link{position:absolute;right:8px;top:2px;font-size:14px}
#gate{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#14213d,#24365f);display:flex;align-items:center;justify-content:center;padding:20px}
#gate[hidden]{display:none}
.gbox{background:#fff;border-radius:16px;padding:24px 20px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.glogo{width:46px;height:46px;border-radius:10px;background:var(--accent);display:grid;place-items:center}.glogo:has(img){background:none;width:auto;height:auto;place-items:start}.glogo img{display:block;max-height:64px;max-width:200px;width:auto;height:auto;object-fit:contain}
.gbox h1{font-size:22px;margin:10px 0 4px}.gsub{color:var(--muted);margin:0 0 8px;font-size:15px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;max-width:92vw;padding:12px 16px;border-radius:10px;background:var(--ink);color:#fff;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}#toast.bad{background:var(--bad)}#toast.ok{background:var(--ok)}
.note{font-size:14px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin:0}.kv dt{color:var(--muted)}.kv dd{margin:0}
</style>
</head>
<body>
<header><div class="hw"><div class="logo" id="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3a2a00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg></div>
  <div><div class="ht">Meus treinamentos</div><div class="hs" id="emp">PREVINE</div></div><button id="out" hidden type="button">Sair</button></div></header>
<main id="app"></main>
<div id="gate"><div class="gbox"><p class="gsub">Carregando…</p></div></div>
<div id="toast"></div>
<script src="../logo.js"></script>
<script>window.__ALUNO_MOCK || document.write('<script type="module" src="api.js?v=2"><\/script>');</script>
<script src="aluno.js?v=31"></script>
</body>
</html>
