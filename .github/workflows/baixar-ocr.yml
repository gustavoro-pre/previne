name: Pacote do OCR do RH (criptografado)
on:
  workflow_dispatch:
    inputs:
      chave:
        description: 'Chave pública (PEM, em base64)'
        required: true
      pasta:
        description: 'Id da pasta com os _ocr_*.json'
        required: true
permissions:
  contents: read
jobs:
  pacote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Montar e criptografar
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          PASTA: ${{ inputs.pasta }}
          CHAVE: ${{ inputs.chave }}
        run: |
          cd tools
          npm init -y >/dev/null
          npm install firebase-admin@12 googleapis@144 --no-audit --no-fund >/dev/null
          node baixar-ocr.mjs
          echo "$CHAVE" | base64 -d > pub.pem
          openssl rand -out k.bin 32
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in k.bin -out k.enc
          gzip -9 pacote.json
          openssl enc -aes-256-cbc -pbkdf2 -salt -in pacote.json.gz -out pacote.enc -pass file:k.bin
          rm -f k.bin pacote.json.gz
          mkdir ../saida && mv k.enc pacote.enc ../saida/
      - uses: actions/upload-artifact@v4
        with:
          name: pacote
          path: saida
          retention-days: 1
