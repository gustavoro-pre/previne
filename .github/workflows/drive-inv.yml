name: Inventário das pastas antigas do Drive
on:
  schedule:
    - cron: '7 * * * *'   # de hora em hora, o dia todo; cada rodada continua de onde a anterior parou (uma por vez)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/drive-inv.mjs', '.github/workflows/drive-inv.yml']
permissions:
  contents: read
concurrency:
  group: drive-inv
  cancel-in-progress: false
jobs:
  inventario:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ferramentas de leitura (PDF e OCR)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-por libreoffice-writer-nogui libreoffice-calc-nogui >/dev/null
      - name: Ler as pastas e montar o inventário
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          LIMITE_MIN: '320'
        run: |
          cd tools
          npm init -y >/dev/null
          npm install firebase-admin@12 googleapis@144 --no-audit --no-fund >/dev/null
          node drive-inv.mjs
